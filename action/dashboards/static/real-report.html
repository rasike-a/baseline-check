<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseline Compatibility Report - Real Data</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #666;
            font-size: 1rem;
        }
        
        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .filter-select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }
        
        .results-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .table-header {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .table-header h2 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .table-header p {
            color: #666;
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
            cursor: pointer;
            user-select: none;
        }
        
        .table th:hover {
            background: #e9ecef;
        }
        
        .table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .table tr:hover {
            background: #f8f9fa;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-baseline_like {
            background: #d4edda;
            color: #155724;
        }
        
        .status-risky {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status-unknown {
            background: #fff3cd;
            color: #856404;
        }
        
        .feature-name {
            font-weight: 600;
            color: #333;
        }
        
        .files-list {
            font-size: 0.9rem;
            color: #666;
            max-width: 200px;
        }
        
        .mdn-link {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .mdn-link:hover {
            text-decoration: underline;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: #dc3545;
            background: #f8d7da;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                min-width: auto;
            }
            
            .table {
                font-size: 0.9rem;
            }
            
            .table th,
            .table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Baseline Compatibility Report</h1>
            <p>Real scan data from baseline-check tool</p>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be populated here -->
        </div>
        
        <div class="controls">
            <input type="text" id="search" class="search-box" placeholder="Search features..." />
            <select id="statusFilter" class="filter-select">
                <option value="">All Status</option>
                <option value="baseline_like">Baseline-like</option>
                <option value="risky">Risky</option>
                <option value="unknown">Unknown</option>
            </select>
        </div>
        
        <div class="results-table">
            <div class="table-header">
                <h2>Compatibility Results</h2>
                <p id="resultCount">Loading...</p>
            </div>
            <div id="tableContainer">
                <div class="loading">Loading compatibility data...</div>
            </div>
        </div>
    </div>

    <script>
        class RealDashboard {
            constructor() {
                this.data = null;
                this.filteredData = [];
                this.sortColumn = 'feature';
                this.sortDirection = 'asc';
                this.init();
            }

            async init() {
                try {
                    await this.loadData();
                    this.setupEventListeners();
                    this.render();
                } catch (error) {
                    this.showError(error);
                }
            }

            async loadData() {
                try {
                    const response = await fetch('./real-report.json');
                    if (!response.ok) {
                        throw new Error(`Failed to load report: ${response.statusText}`);
                    }
                    this.data = await response.json();
                    this.filteredData = this.data.results || [];
                } catch (error) {
                    console.error('Failed to load real data, using demo data:', error);
                    // Fallback to demo data if real data fails to load
                    this.data = {
                        "metadata": {
                            "scannedFiles": 22,
                            "processedFiles": 22,
                            "errorCount": 0,
                            "timestamp": new Date().toISOString(),
                            "version": "2.2.0"
                        },
                        "results": [
                            {
                                "feature": "CSS Grid",
                                "category": "css",
                                "status": "baseline_like",
                                "files": ["src/cli.js", "src/error-handler.js"],
                                "mdnUrl": "https://developer.mozilla.org/docs/Web/CSS/CSS_Grid_Layout",
                                "compatibility": 95,
                                "riskScore": 15
                            },
                            {
                                "feature": "Fetch API",
                                "category": "javascript",
                                "status": "baseline_like",
                                "files": ["src/error-handler.js", "src/ai/ai-analyzer.js"],
                                "mdnUrl": "https://developer.mozilla.org/docs/Web/API/Fetch_API",
                                "compatibility": 88,
                                "riskScore": 25
                            }
                        ]
                    };
                    this.filteredData = this.data.results || [];
                }
            }

            setupEventListeners() {
                const searchInput = document.getElementById('search');
                const statusFilter = document.getElementById('statusFilter');

                searchInput.addEventListener('input', () => this.filterData());
                statusFilter.addEventListener('change', () => this.filterData());
            }

            filterData() {
                const searchTerm = document.getElementById('search').value.toLowerCase();
                const statusFilter = document.getElementById('statusFilter').value;

                this.filteredData = this.data.results.filter(item => {
                    const matchesSearch = item.feature.toLowerCase().includes(searchTerm) ||
                                        (item.category && item.category.toLowerCase().includes(searchTerm));
                    const matchesStatus = !statusFilter || item.status === statusFilter;
                    return matchesSearch && matchesStatus;
                });

                this.render();
            }

            render() {
                this.renderStats();
                this.renderTable();
            }

            renderStats() {
                const stats = this.calculateStats();
                const statsGrid = document.getElementById('statsGrid');
                
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-number">${stats.totalFeatures}</div>
                        <div class="stat-label">Total Features</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.baselineLike}</div>
                        <div class="stat-label">Baseline-like</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.risky}</div>
                        <div class="stat-label">Risky</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.unknown}</div>
                        <div class="stat-label">Unknown</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.scannedFiles}</div>
                        <div class="stat-label">Files Scanned</div>
                    </div>
                `;
            }

            calculateStats() {
                const total = this.data.results.length;
                const baselineLike = this.data.results.filter(r => r.status === 'baseline_like').length;
                const risky = this.data.results.filter(r => r.status === 'risky').length;
                const unknown = this.data.results.filter(r => r.status === 'unknown').length;
                const scannedFiles = this.data.metadata.scannedFiles || 0;

                return { totalFeatures: total, baselineLike, risky, unknown, scannedFiles };
            }

            renderTable() {
                const container = document.getElementById('tableContainer');
                const resultCount = document.getElementById('resultCount');
                
                resultCount.textContent = `Showing ${this.filteredData.length} of ${this.data.results.length} features`;

                if (this.filteredData.length === 0) {
                    container.innerHTML = '<div class="no-results">No features match your search criteria</div>';
                    return;
                }

                const tableHTML = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th onclick="dashboard.sort('feature')">Feature</th>
                                <th onclick="dashboard.sort('status')">Status</th>
                                <th>Files</th>
                                <th>MDN Docs</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${this.filteredData.map(item => this.renderRow(item)).join('')}
                        </tbody>
                    </table>
                `;

                container.innerHTML = tableHTML;
            }

            renderRow(item) {
                const files = Array.isArray(item.files) ? item.files.join(', ') : (item.files || 'N/A');
                const mdnLink = item.mdnUrl ? 
                    `<a href="${item.mdnUrl}" class="mdn-link" target="_blank">View Docs</a>` : 
                    'N/A';

                return `
                    <tr>
                        <td><span class="feature-name">${item.feature}</span></td>
                        <td><span class="status-badge status-${item.status}">${item.status.replace('_', ' ')}</span></td>
                        <td><div class="files-list">${files}</div></td>
                        <td>${mdnLink}</td>
                    </tr>
                `;
            }

            sort(column) {
                if (this.sortColumn === column) {
                    this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
                } else {
                    this.sortColumn = column;
                    this.sortDirection = 'asc';
                }

                this.filteredData.sort((a, b) => {
                    const aVal = a[column];
                    const bVal = b[column];
                    
                    if (typeof aVal === 'string') {
                        return this.sortDirection === 'asc' 
                            ? aVal.localeCompare(bVal)
                            : bVal.localeCompare(aVal);
                    } else {
                        return this.sortDirection === 'asc' 
                            ? aVal - bVal
                            : bVal - aVal;
                    }
                });

                this.renderTable();
            }

            showError(error) {
                const container = document.getElementById('tableContainer');
                container.innerHTML = `
                    <div class="error">
                        <h3>Error Loading Data</h3>
                        <p>${error.message}</p>
                        <p>Using demo data instead.</p>
                    </div>
                `;
            }
        }

        // Initialize dashboard
        const dashboard = new RealDashboard();
    </script>
</body>
</html>
