name: Auto Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: |
          cd action
          npm ci
          
      - name: Run tests
        run: |
          cd action
          npm test
          
      - name: Build package
        run: |
          cd action
          npm run build
          
      - name: Publish to NPM
        run: |
          cd action
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## 🚀 Baseline Check Tool ${{ github.ref_name }}
            
            ### What's New
            - Enhanced compatibility checking
            - Improved error handling
            - New framework integrations
            - Better performance and caching
            
            ### Installation
            ```bash
            npm install -g baseline-check-tool@${{ github.ref_name }}
            ```
            
            ### Quick Start
            ```bash
            npx baseline-check-tool@${{ github.ref_name }} init
            npx baseline-check-tool@${{ github.ref_name }} run --paths 'src'
            ```
            
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v2.1.2...${{ github.ref_name }}
          draft: false
          prerelease: false
